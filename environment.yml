name: scripts_wf
channels:
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
dependencies:
  - python=3.10
  # forgeffects exige tensorflow==2.13, que exige numpy<=1.24.3.
  # forgethreads (new_job / sweep_job) verificado con numpy 1.24.3.
  - numpy=1.24.3
  - requests
  - pip
  - pip:
      - forgeffects==0.2.5
      - tensorflow==2.13.0
      - tensorflow-probability==0.20.0
      # CUDA 11.8 + cuDNN 8.6 para TF 2.13, por pip: el nodo solo necesita driver >= 520,
      # sin importar su toolkit CUDA. tf_env.sh los pone en LD_LIBRARY_PATH.
      - nvidia-cudnn-cu11==8.6.0.163
      - nvidia-cublas-cu11==11.11.3.6
      - nvidia-cuda-runtime-cu11==11.8.89
      - nvidia-cufft-cu11==10.9.0.58
      - nvidia-curand-cu11==10.3.0.86
      - nvidia-cusolver-cu11==11.4.1.48
      - nvidia-cusparse-cu11==11.7.5.86
      - pandas==2.3.3
      - pytest==9.1.1
